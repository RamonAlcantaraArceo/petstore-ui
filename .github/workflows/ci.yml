name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.local/share/pnpm/store
            node_modules/.pnpm
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        env:
          PNPM_STORE_PATH: ~/.pnpm-store
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prettier format check
        continue-on-error: true
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run type-check

  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [app, atoms, shared, visual-reporter]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.local/share/pnpm/store
            node_modules/.pnpm
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        env:
          PNPM_STORE_PATH: ~/.pnpm-store
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run unit tests (packages/${{ matrix.package }}) with retry
        run: |
          rm -rf junit coverage
          mkdir -p junit coverage

          for i in 1 2 3; do
            echo "Attempt $i for packages/${{ matrix.package }}"
            pnpm exec vitest run --project unit "packages/${{ matrix.package }}" \
              --coverage \
              --coverage.reportsDirectory "coverage/${{ matrix.package }}" && break
            if [ $i -eq 3 ]; then
              echo "Tests failed for packages/${{ matrix.package }} after 3 attempts"
              exit 1
            fi
            echo "Retrying packages/${{ matrix.package }}..."
          done

          cp junit.xml "junit/junit-${{ matrix.package }}.xml"

      - name: Upload JUnit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-report-${{ matrix.package }}
          path: junit/junit-${{ matrix.package }}.xml
          if-no-files-found: warn

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.package }}
          path: coverage/${{ matrix.package }}
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/${{ matrix.package }}/lcov.info
          flags: unittests,${{ matrix.package }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit/junit-${{ matrix.package }}.xml
          flags: vitest-tests,${{ matrix.package }}
          name: codecov-tests-${{ matrix.package }}
          report_type: test_results
          verbose: true
          fail_ci_if_error: false

  storybook:
    name: Storybook Build & Bundle Stats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.local/share/pnpm/store
            node_modules/.pnpm
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        env:
          PNPM_STORE_PATH: ~/.pnpm-store
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Storybook
        run: pnpm run build-storybook

      - name: Run Chromatic
        # if: startsWith(github.head_ref, 'chromatic/')
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_TOKEN }}

      # - name: Run Chromatic visual regression tests
      #   # if: startsWith(github.head_ref, 'chromatic/')
      #   env:
      #     CHROMATIC_TOKEN: ${{ secrets.CHROMATIC_TOKEN }}
      #   run: pnpm run chromatic --exit-zero-on-changes

      - name: Emit bundle stats (Vite + Codecov plugin)
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          CODECOV_DRY_RUN: 'false'
        run: pnpm run build:bundle-stats

      - name: Upload bundle stats to Codecov
        if: ${{ hashFiles('dist/codecov/*-stats.json') != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./dist/codecov/*-stats.json
          flags: bundle-analysis
          name: codecov-bundle-analysis
          fail_ci_if_error: false

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Docker build validation
        timeout-minutes: 15
        env:
          DOCKER_BUILDKIT: '1'
          BUILDKIT_PROGRESS: plain
        run: |
          docker build \
            --target builder \
            --build-arg CI=true \
            --build-arg STORYBOOK_DISABLE_TELEMETRY=1 \
            --build-arg DO_NOT_TRACK=1 \
            -t petstore-ui:ci \
            .
