name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.local/share/pnpm/store
            node_modules/.pnpm
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        env:
          PNPM_STORE_PATH: ~/.pnpm-store
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prettier format check
        continue-on-error: true
        run: pnpm run format:check

      - name: Lint
        continue-on-error: true
        run: pnpm run lint

      - name: Type check
        continue-on-error: true
        run: pnpm run type-check

      - name: Cache Playwright browser binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
        run: npx playwright install --with-deps chromium

      - name: Test packages with retry
        run: |
          rm -rf junit
          mkdir -p junit
          rm -rf coverage
          mkdir -p coverage

          for pkg in app atoms shared visual-reporter; do
            echo "Running tests for packages/$pkg"
            for i in 1 2 3; do
              echo "Attempt $i for packages/$pkg"
              pnpm exec vitest run "packages/$pkg" --coverage --coverage.reportsDirectory "coverage/$pkg" && break
              if [ $i -eq 3 ]; then
                echo "Tests failed for packages/$pkg after 3 attempts"
                exit 1
              fi
              echo "Retrying packages/$pkg..."
            done

            cp junit.xml "junit/junit-${pkg}.xml"
          done

      - name: Upload JUnit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-report
          path: junit/*.xml
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/*/lcov.info
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit/*.xml
          flags: vitest-tests
          name: codecov-tests-vitest
          report_type: test_results
          verbose: true
          fail_ci_if_error: false

      - name: Build Storybook
        run: pnpm run build-storybook

      # - name: Visual regression tests
      #   run: pnpm run test:visual

      - name: Emit bundle stats (Vite + Codecov plugin)
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          CODECOV_DRY_RUN: 'false'
        run: pnpm run build:bundle-stats

      - name: Upload bundle stats to Codecov
        if: ${{ hashFiles('dist/codecov/*-stats.json') != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./dist/codecov/*-stats.json
          flags: bundle-analysis
          name: codecov-bundle-analysis
          fail_ci_if_error: false

      - name: Docker build validation
        timeout-minutes: 15
        env:
          DOCKER_BUILDKIT: '1'
          BUILDKIT_PROGRESS: plain
        run: |
          docker build \
            --target builder \
            --build-arg CI=true \
            --build-arg STORYBOOK_DISABLE_TELEMETRY=1 \
            --build-arg DO_NOT_TRACK=1 \
            -t petstore-ui:ci \
            .
